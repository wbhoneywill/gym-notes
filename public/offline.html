<!doctype html>
<html lang="en">
<head>

    :root{color-scheme:dark;background:#0c0d0e;color:#f4f5f3;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:1.5rem;box-sizing:border-box}.card{max-width:28rem;padding:1.4rem;border:1px solid #26282b;border-radius:.85rem;background:#141618}.eyebrow{color:#c8ff3c;font-size:.72rem;font-weight:750;letter-spacing:.14em;text-transform:uppercase}h1{font-size:1.55rem;margin:.45rem 0}p{color:#a4a8ad;line-height:1.55;margin:.5rem 0 1.2rem}button{min-height:2.75rem;padding:.65rem 1rem;border:0;border-radius:.6rem;background:#c8ff3c;color:#0c0d0e;font:inherit;font-weight:750}
  </style>
</head>
<body><main class="card"><div class="eyebrow">GymNotes</div><h1>You’re offline</h1><p>If you previously opened an active workout on this device, return to that workout from your browser history or Home Screen. Other screens will reconnect automatically when the network returns.</p><button type="button" onclick="location.reload()">Try again</button></main></body>
